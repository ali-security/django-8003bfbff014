# seal-build: build and test Django 3.2.25 on the ali-security fork.
#
# Upstream Django 3.2.x has no GitHub Actions CI (it runs on Jenkins), so this
# workflow mirrors tox.ini instead: `pip install -e .`,
# `pip install -r tests/requirements/py3.txt`, then `tests/runtests.py`.
# It also exercises the GeoDjango spatial backends (SpatiaLite and PostGIS).
# The build-tool pins in the `build` job reproduce the public sdist and wheel
# byte-for-byte; do not change them.
#
# The GIS jobs run inside an ubuntu:20.04 container because its GEOS 3.8,
# GDAL 3.0 and SpatiaLite 4.3 are within Django 3.2's supported library
# versions (ubuntu-22.04's GEOS 3.10 / GDAL 3.4 / SpatiaLite 5 are not).
# Python 3.10 in the test matrix is pinned to 3.10.13 (the release-era patch)
# because later 3.10.x stdlib fixes (ipaddress, html.parser) change behaviour
# asserted by Django 3.2 tests.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional Django test labels to run instead of the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install "setuptools==59.6.0" "wheel==0.37.1" "build==1.1.1"

      - name: Build sdist and wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m build --no-isolation
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10.13"]
    env:
      PIP_INDEX_URL: https://:2024-03-04@time-machines-pypi.sealsecurity.io/
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y libmemcached-dev gettext

      - name: Install Django and test requirements
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -e .
          python -m pip install -r tests/requirements/py3.txt

      - name: Run tests
        shell: bash
        run: |
          set -euxo pipefail
          cd tests && python -u runtests.py -v 1 --parallel 4 ${{ inputs.test-filter }}

  test-spatialite:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_INDEX_URL: https://:2024-03-04@time-machines-pypi.sealsecurity.io/
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages and create venv
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update && apt-get install -y python3 python3-pip python3-venv python3-dev gcc g++ make libmemcached-dev zlib1g-dev gettext binutils libproj-dev gdal-bin libgeos-dev libsqlite3-mod-spatialite
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Install Django and test requirements
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install "pip<24.1"
          python -m pip install -e .
          python -m pip install -r tests/requirements/py3.txt

      - name: Write SpatiaLite settings
        shell: bash
        run: |
          set -euxo pipefail
          cat > tests/test_spatialite.py <<'EOF'
          DATABASES = {
              'default': {'ENGINE': 'django.contrib.gis.db.backends.spatialite'},
              'other': {'ENGINE': 'django.contrib.gis.db.backends.spatialite'},
          }
          SECRET_KEY = 'django_tests_secret_key'
          PASSWORD_HASHERS = ['django.contrib.auth.hashers.MD5PasswordHasher']
          DEFAULT_AUTO_FIELD = 'django.db.models.AutoField'
          EOF
          cat tests/test_spatialite.py

      - name: Run GIS tests (SpatiaLite)
        shell: bash
        run: |
          set -euxo pipefail
          cd tests && python -u runtests.py -v 1 --parallel 4 --settings=test_spatialite ${{ inputs.test-filter || 'gis_tests' }}

  test-postgis:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_INDEX_URL: https://:2024-03-04@time-machines-pypi.sealsecurity.io/
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      postgres:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geodjango
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages and create venv
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update && apt-get install -y python3 python3-pip python3-venv python3-dev gcc g++ make libmemcached-dev zlib1g-dev gettext binutils libproj-dev gdal-bin libgeos-dev libpq-dev
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Install Django and test requirements
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install "pip<24.1"
          python -m pip install -e .
          python -m pip install -r tests/requirements/py3.txt
          python -m pip install -r tests/requirements/postgres.txt

      - name: Write PostGIS settings
        shell: bash
        run: |
          set -euxo pipefail
          cat > tests/test_postgis.py <<'EOF'
          DATABASES = {
              'default': {
                  'ENGINE': 'django.contrib.gis.db.backends.postgis',
                  'NAME': 'geodjango',
                  'USER': 'postgres',
                  'PASSWORD': 'postgres',
                  'HOST': 'postgres',
                  'PORT': '5432',
              },
              'other': {
                  'ENGINE': 'django.contrib.gis.db.backends.postgis',
                  'NAME': 'other',
                  'USER': 'postgres',
                  'PASSWORD': 'postgres',
                  'HOST': 'postgres',
                  'PORT': '5432',
              },
          }
          SECRET_KEY = 'django_tests_secret_key'
          PASSWORD_HASHERS = ['django.contrib.auth.hashers.MD5PasswordHasher']
          DEFAULT_AUTO_FIELD = 'django.db.models.AutoField'
          EOF
          cat tests/test_postgis.py

      - name: Run GIS tests (PostGIS)
        shell: bash
        run: |
          set -euxo pipefail
          cd tests && python -u runtests.py -v 1 --parallel 4 --settings=test_postgis ${{ inputs.test-filter || 'gis_tests' }}
